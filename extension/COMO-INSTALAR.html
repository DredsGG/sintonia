<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sintonia</title>
<style>
/* Guia no visual da página do YouTube (tema escuro): fundo #0f0f0f, caixas rgba(255,255,255,.1) raio 12, Roboto, azul de ação #3ea6ff. */
:root { --bg:#0f0f0f; --tx:#f1f1f1; --tx2:#aaa; --add:rgba(255,255,255,.1); --line:rgba(255,255,255,.2); --acc:#3ea6ff; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--tx); font: 16px/24px Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
.top { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .in { max-width: 820px; margin: 0 auto; height: 56px; padding: 0 16px; display: flex; align-items: center; gap: 12px; }
.top svg { color: var(--acc); } .top b { font-size: 18px; font-weight: 500; }
nav.langs { margin-left: auto; display: flex; gap: 2px; }
nav.langs button { font: 500 12px Roboto, Arial, sans-serif; height: 28px; padding: 0 10px; border-radius: 14px; border: 0; background: none; color: var(--tx2); cursor: pointer; }
nav.langs button.on { background: var(--add); color: var(--tx); }
main { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 24px; line-height: 32px; margin: 0 0 4px; font-weight: 700; } .works { color: var(--tx2); margin: 0 0 24px; }
h2 { font-size: 20px; line-height: 28px; margin: 32px 0 12px; font-weight: 700; scroll-margin-top: 72px; }
.box { background: var(--add); border-radius: 12px; padding: 16px 20px; margin: 0 0 12px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; }
.tabs button { font: 500 14px Roboto, Arial, sans-serif; height: 32px; padding: 0 12px; border-radius: 8px; border: 0; background: var(--add); color: var(--tx); cursor: pointer; }
.tabs button.on { background: var(--tx); color: var(--bg); }
ol { margin: 0; padding-left: 22px; } li { margin: 6px 0; }
code { background: rgba(255,255,255,.12); padding: 1px 6px; border-radius: 4px; font-size: 14px; }
.note { color: var(--tx2); font-size: 14px; }
footer { max-width: 820px; margin: 0 auto; padding: 16px; color: var(--tx2); font-size: 12px; border-top: 1px solid var(--line); }
footer a { color: var(--tx); text-decoration: none; font-weight: 500; }
</style>
</head>
<body>
<div class="top"><div class="in"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13.5" r="7"/><path d="M12 13.5l3.6-3.6"/><path d="M4.4 6.4l1.3 1.3M12 3v1.8M19.6 6.4l-1.3 1.3"/></svg><b>Sintonia</b>
  <nav class="langs"><button data-l="pt">PT</button><button data-l="en">EN</button><button data-l="es">ES</button></nav></div></div>
<main id="m"></main>
<footer id="f"></footer>
<script src="src/i18n.js"></script>
<script src="guia.js"></script>
</body>
</html>
